<svg width="900" viewBox="0 0 900 980" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Fonts and base styles -->
  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
    .label-sm  { font-size: 11px; fill: #555; }
    .label-layer { font-size: 11px; font-weight: 600; }
    /* Amber/Bronze */
    .amber-box  { fill: #FEF3C7; stroke: #D97706; stroke-width: 0.8; }
    .amber-title { font-size: 12px; font-weight: 700; fill: #92400E; }
    .amber-sub   { font-size: 10px; fill: #B45309; }
    /* Teal/Silver */
    .teal-box   { fill: #CCFBF1; stroke: #0F766E; stroke-width: 0.8; }
    .teal-title  { font-size: 12px; font-weight: 700; fill: #134E4A; }
    .teal-sub    { font-size: 10px; fill: #0F766E; }
    /* Blue/Gold */
    .blue-box   { fill: #DBEAFE; stroke: #1D4ED8; stroke-width: 0.8; }
    .blue-title  { font-size: 12px; font-weight: 700; fill: #1E3A8A; }
    .blue-sub    { font-size: 10px; fill: #1D4ED8; }
    /* Purple/Python */
    .purple-box  { fill: #EDE9FE; stroke: #6D28D9; stroke-width: 0.8; }
    .purple-title { font-size: 12px; font-weight: 700; fill: #3B0764; }
    .purple-sub   { font-size: 10px; fill: #6D28D9; }
    /* Gray */
    .gray-box   { fill: #F3F4F6; stroke: #6B7280; stroke-width: 0.8; }
    .gray-title  { font-size: 12px; font-weight: 700; fill: #111827; }
    .gray-sub    { font-size: 10px; fill: #4B5563; }
    /* Section dashes */
    .dash-amber  { fill: none; stroke: #D97706; stroke-width: 1; stroke-dasharray: 5 3; opacity: 0.7; }
    .dash-teal   { fill: none; stroke: #0F766E; stroke-width: 1; stroke-dasharray: 5 3; opacity: 0.7; }
    .dash-blue   { fill: none; stroke: #1D4ED8; stroke-width: 1; stroke-dasharray: 5 3; opacity: 0.7; }
    .dash-purple { fill: none; stroke: #6D28D9; stroke-width: 1; stroke-dasharray: 5 3; opacity: 0.7; }
    .arr         { stroke: #6B7280; stroke-width: 1.5; fill: none; }
  </style>

  <!-- ═══════════════════════════════════════
       SOURCE
  ═══════════════════════════════════════ -->
  <text x="450" y="22" text-anchor="middle" class="label-sm">Source</text>
  <rect x="120" y="30" width="660" height="50" rx="8" class="gray-box"/>
  <text x="450" y="52" text-anchor="middle" class="gray-title">MIMIC-IV v3.1 on BigQuery (PhysioNet)</text>
  <text x="450" y="68" text-anchor="middle" class="gray-sub">admissions · patients · labevents · chartevents · ventilation · icustays · transfers · omr</text>

  <line x1="450" y1="80" x2="450" y2="108" class="arr" marker-end="url(#arrow)"/>

  <!-- ═══════════════════════════════════════
       BRONZE LAYER
  ═══════════════════════════════════════ -->
  <text x="450" y="124" text-anchor="middle" class="label-sm">Bronze layer — cohort definition (session temp tables, run in order)</text>
  <rect x="50" y="132" width="800" height="210" rx="10" class="dash-amber"/>
  <text x="44" y="240" text-anchor="middle" transform="rotate(-90,44,240)" class="label-layer" fill="#D97706">Bronze</text>

  <!-- Row 1: three boxes -->
  <rect x="68" y="148" width="234" height="62" rx="7" class="amber-box"/>
  <text x="185" y="168" text-anchor="middle" class="amber-title">Step 1: cohort_hadm_ids</text>
  <text x="185" y="183" text-anchor="middle" class="amber-sub">5,000 vented admissions</text>
  <text x="185" y="197" text-anchor="middle" class="amber-sub">5,000 non-vented (50/50 balance)</text>

  <rect x="318" y="148" width="234" height="62" rx="7" class="amber-box"/>
  <text x="435" y="168" text-anchor="middle" class="amber-title">Step 2: transfers_units_temp</text>
  <text x="435" y="183" text-anchor="middle" class="amber-sub">ICU unit flags per transfer row</text>
  <text x="435" y="197" text-anchor="middle" class="amber-sub">Identifies ICU vs floor blocks</text>

  <rect x="568" y="148" width="264" height="62" rx="7" class="amber-box"/>
  <text x="700" y="168" text-anchor="middle" class="amber-title">Step 3: admissions_temp</text>
  <text x="700" y="183" text-anchor="middle" class="amber-sub">Exclusions: ED intubation, PACU,</text>
  <text x="700" y="197" text-anchor="middle" class="amber-sub">OB, ICU-start, DNR/DNI patients</text>

  <!-- Row 2: two boxes -->
  <line x1="435" y1="210" x2="435" y2="240" class="arr" marker-end="url(#arrow)"/>

  <rect x="143" y="248" width="260" height="62" rx="7" class="amber-box"/>
  <text x="273" y="268" text-anchor="middle" class="amber-title">Step 4: vent_patients_temp</text>
  <text x="273" y="283" text-anchor="middle" class="amber-sub">Ventilation events with start/stop</text>
  <text x="273" y="297" text-anchor="middle" class="amber-sub">timestamps per admission</text>

  <rect x="447" y="248" width="260" height="62" rx="7" class="amber-box"/>
  <text x="577" y="268" text-anchor="middle" class="amber-title">Step 4b: omr_vitals</text>
  <text x="577" y="283" text-anchor="middle" class="amber-sub">Pre-admission OMR vitals</text>
  <text x="577" y="297" text-anchor="middle" class="amber-sub">BMI, eGFR (30-day lookback)</text>

  <line x1="450" y1="342" x2="450" y2="372" class="arr" marker-end="url(#arrow)"/>

  <!-- ═══════════════════════════════════════
       SILVER LAYER
  ═══════════════════════════════════════ -->
  <text x="450" y="390" text-anchor="middle" class="label-sm">Silver layer — feature engineering (Step 5 main pipeline query)</text>
  <rect x="50" y="398" width="800" height="168" rx="10" class="dash-teal"/>
  <text x="44" y="482" text-anchor="middle" transform="rotate(-90,44,482)" class="label-layer" fill="#0F766E">Silver</text>

  <!-- Row 1: three teal boxes -->
  <rect x="68" y="414" width="234" height="62" rx="7" class="teal-box"/>
  <text x="185" y="434" text-anchor="middle" class="teal-title">12-hour blocks</text>
  <text x="185" y="449" text-anchor="middle" class="teal-sub">block_num sequence per admission</text>
  <text x="185" y="463" text-anchor="middle" class="teal-sub">ICU blocks excluded</text>

  <rect x="318" y="414" width="234" height="62" rx="7" class="teal-box"/>
  <text x="435" y="434" text-anchor="middle" class="teal-title">Vitals + labs per block</text>
  <text x="435" y="449" text-anchor="middle" class="teal-sub">Mean / min / max aggregates</text>
  <text x="435" y="463" text-anchor="middle" class="teal-sub">chartevents, labevents</text>

  <rect x="568" y="414" width="264" height="62" rx="7" class="teal-box"/>
  <text x="700" y="434" text-anchor="middle" class="teal-title">label_vent_next_12h</text>
  <text x="700" y="449" text-anchor="middle" class="teal-sub">Binary outcome label per block</text>
  <text x="700" y="463" text-anchor="middle" class="teal-sub">1 if intubated in next window</text>

  <!-- Row 2: two teal boxes -->
  <rect x="193" y="496" width="240" height="52" rx="7" class="teal-box"/>
  <text x="313" y="516" text-anchor="middle" class="teal-title">Sparse lab missingness flags</text>
  <text x="313" y="531" text-anchor="middle" class="teal-sub">BNP, troponin, ABG (pCO2, pH, pO2)</text>

  <rect x="467" y="496" width="240" height="52" rx="7" class="teal-box"/>
  <text x="587" y="516" text-anchor="middle" class="teal-title">Medications + procedures</text>
  <text x="587" y="531" text-anchor="middle" class="teal-sub">Vasopressors, antibiotics (EMAR/POE)</text>

  <line x1="450" y1="566" x2="450" y2="596" class="arr" marker-end="url(#arrow)"/>

  <!-- ═══════════════════════════════════════
       GOLD LAYER
  ═══════════════════════════════════════ -->
  <text x="450" y="614" text-anchor="middle" class="label-sm">Gold layer — persisted model-ready feature table</text>
  <rect x="50" y="622" width="800" height="62" rx="10" class="dash-blue"/>
  <text x="44" y="655" text-anchor="middle" transform="rotate(-90,44,655)" class="label-layer" fill="#1D4ED8">Gold</text>

  <rect x="130" y="634" width="640" height="40" rx="7" class="blue-box"/>
  <text x="450" y="650" text-anchor="middle" class="blue-title">features_10k  (BigQuery persisted table)</text>
  <text x="450" y="664" text-anchor="middle" class="blue-sub">~10,000 admissions · 12h blocks · 30+ features · label_vent_next_12h</text>

  <line x1="450" y1="684" x2="450" y2="714" class="arr" marker-end="url(#arrow)"/>

  <!-- ═══════════════════════════════════════
       PYTHON LAYER
  ═══════════════════════════════════════ -->
  <text x="450" y="732" text-anchor="middle" class="label-sm">Python notebook — preprocessing, modeling, evaluation</text>
  <rect x="50" y="740" width="800" height="216" rx="10" class="dash-purple"/>
  <text x="44" y="852" text-anchor="middle" transform="rotate(-90,44,852)" class="label-layer" fill="#6D28D9">Python</text>

  <!-- Preprocessing row -->
  <rect x="68" y="756" width="234" height="58" rx="7" class="purple-box"/>
  <text x="185" y="776" text-anchor="middle" class="purple-title">Preprocessing</text>
  <text x="185" y="791" text-anchor="middle" class="purple-sub">One-hot encode, median impute</text>
  <text x="185" y="805" text-anchor="middle" class="purple-sub">StandardScaler for LR</text>

  <rect x="318" y="756" width="234" height="58" rx="7" class="purple-box"/>
  <text x="435" y="776" text-anchor="middle" class="purple-title">GroupShuffleSplit 80/20</text>
  <text x="435" y="791" text-anchor="middle" class="purple-sub">Patient-level train/test split</text>
  <text x="435" y="805" text-anchor="middle" class="purple-sub">No patient leakage</text>

  <rect x="568" y="756" width="264" height="58" rx="7" class="purple-box"/>
  <text x="700" y="776" text-anchor="middle" class="purple-title">GroupKFold CV (5-fold)</text>
  <text x="700" y="791" text-anchor="middle" class="purple-sub">Cross-validation on train set</text>
  <text x="700" y="805" text-anchor="middle" class="purple-sub">Patient-grouped folds</text>

  <!-- Models row -->
  <rect x="68" y="836" width="234" height="58" rx="7" class="purple-box"/>
  <text x="185" y="856" text-anchor="middle" class="purple-title">Logistic regression</text>
  <text x="185" y="871" text-anchor="middle" class="purple-sub">class_weight=balanced</text>
  <text x="185" y="885" text-anchor="middle" class="purple-sub">solver=liblinear</text>

  <rect x="318" y="836" width="234" height="58" rx="7" class="purple-box"/>
  <text x="435" y="856" text-anchor="middle" class="purple-title">Random forest</text>
  <text x="435" y="871" text-anchor="middle" class="purple-sub">300 trees, max_depth=12</text>
  <text x="435" y="885" text-anchor="middle" class="purple-sub">class_weight=balanced</text>

  <rect x="568" y="836" width="264" height="58" rx="7" class="purple-box"/>
  <text x="700" y="856" text-anchor="middle" class="purple-title">XGBoost</text>
  <text x="700" y="871" text-anchor="middle" class="purple-sub">scale_pos_weight, eval=AUPRC</text>
  <text x="700" y="885" text-anchor="middle" class="purple-sub">400 estimators, max_depth=6</text>

  <line x1="450" y1="956" x2="450" y2="930" class="arr"/>
  <line x1="450" y1="956" x2="450" y2="960" class="arr" marker-end="url(#arrow)"/>
  <!-- just one arrow down -->
  <line x1="450" y1="894" x2="450" y2="920" class="arr" marker-end="url(#arrow)"/>

  <!-- OUTPUT -->
  <rect x="100" y="922" width="700" height="48" rx="8" class="gray-box"/>
  <text x="450" y="942" text-anchor="middle" class="gray-title">Evaluation output</text>
  <text x="450" y="958" text-anchor="middle" class="gray-sub">AUROC · AUPRC · Sensitivity · Specificity · PPV · NPV · Brier score · ECE · Calibration curves (reliability diagrams)</text>

</svg>
